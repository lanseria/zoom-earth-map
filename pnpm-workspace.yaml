allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@vue/compiler-core@3.5.39'
  - '@vue/compiler-dom@3.5.39'
  - '@vue/compiler-sfc@3.5.39'
  - '@vue/compiler-ssr@3.5.39'
  - '@vue/reactivity@3.5.39'
  - '@vue/runtime-core@3.5.39'
  - '@vue/runtime-dom@3.5.39'
  - '@vue/server-renderer@3.5.39'
  - '@vue/shared@3.5.39'
  - vue@3.5.39
# 原 .npmrc 迁移过来的配置（注意改为小驼峰）
shamefullyHoist: true
strictPeerDependencies: false
shellEmulator: true

trustPolicy: no-downgrade

trustPolicyExclude:
  - chokidar@4.0.3
  - semver@6.3.1
  - nanoid@3.3.14

packages: []

catalogs:
  build:
    '@nuxt/devtools': ^3.4.1
    '@nuxt/eslint': ^1.17.0
    '@nuxt/kit': ^4.5.2
    '@nuxtjs/color-mode': ^4.0.1
    '@pinia/nuxt': ^1.0.2
    '@types/node': ^26.2.0
    '@unocss/eslint-config': ^66.7.5
    '@unocss/nuxt': ^66.7.5
    '@vueuse/nuxt': ^14.4.0
    nuxt: ^4.5.2
    unocss: ^66.7.5
    unplugin: ^3.3.0
    vite: ^8.2.1
  dev:
    '@antfu/eslint-config': ^9.3.0
    eslint: ^10.8.1
    eslint-plugin-format: ^2.0.1
    typescript: ^6.0.3
    vue-tsc: ^3.3.10
  frontend:
    '@vueuse/core': ^14.4.0
    maplibre-gl: ^6.4.0
    pinia: ^4.0.3
    vue: ^3.5.41
  icons:
    '@iconify-json/carbon': ^1.2.25
    '@iconify-json/twemoji': ^1.2.5

onlyBuiltDependencies:
  - '@parcel/watcher'
  - esbuild
  - unrs-resolver
